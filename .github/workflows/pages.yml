name: Github Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:
# to only run when you do a new github release, comment out above part and uncomment the below trigger.
# on:
#   release:
#     types:
#       - published

permissions:
  contents: write # for committing to gh-pages branch.

jobs:
  build-github-pages:
    runs-on: ubuntu-latest
    defaults:
      run:
        # everything is run from cavalier_contours_ui directory for building
        working-directory: ./cavalier_contours_ui
    steps:
      - uses: actions/checkout@v4 # repo checkout
      - name: Resolve public URL
        id: public-url
        shell: bash
        env:
          PAGES_PUBLIC_URL: ${{ vars.PAGES_PUBLIC_URL }}
        run: |
          if [ -n "${PAGES_PUBLIC_URL}" ]; then
            resolved="${PAGES_PUBLIC_URL}"
          else
            owner="${GITHUB_REPOSITORY_OWNER}"
            repo="${GITHUB_REPOSITORY#*/}"
            if [ "${repo}" = "${owner}.github.io" ]; then
              resolved="https://${owner}.github.io"
            else
              resolved="https://${owner}.github.io/${repo}"
            fi
          fi
          echo "value=${resolved}" >> "${GITHUB_OUTPUT}"
          echo "Resolved public URL: ${resolved}"
      - name: Setup toolchain for wasm
        run: |
          rustup update stable
          rustup default stable
          rustup set profile minimal
          rustup target add wasm32-unknown-unknown
      - name: Rust Cache # cache the rust build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Download and install Trunk binary
        run: wget -qO- https://github.com/thedodd/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf-
      - name: Build # build
        # Use repo-scoped URL by default so forks deploy correctly.
        # Optional override: repository variable `PAGES_PUBLIC_URL`.
        run: ./trunk build --release --public-url $public_url --cargo-profile="web-release"
        env:
          public_url: ${{ steps.public-url.outputs.value }}
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ./cavalier_contours_ui/dist
          # this option will not maintain any history of your previous pages deployment
          # set to false if you want all page build to be committed to your gh-pages branch history
          single-commit: true
